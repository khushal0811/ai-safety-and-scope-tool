<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      
      .translucent-capsule-dark { 
        fill: rgba(255, 255, 255, 0.03); 
        stroke: rgba(255, 255, 255, 0.1); 
        stroke-width: 2; 
      }
      
      .divider-line-dark { stroke: rgba(255, 255, 255, 0.18); stroke-width: 3.5; stroke-linecap: round; }
      
      .blocked-perimeter { stroke: #ef4444; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .allowed-perimeter { stroke: #10b981; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      
      .text-title-dark { 
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
        font-weight: 800; 
        font-size: 88px; 
        fill: #ffffff; 
        letter-spacing: 1.5px;
        dominant-baseline: central;
      }
      .text-sst-dark {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
        font-weight: 800; 
        font-size: 88px; 
        fill: #6272f0; 
        letter-spacing: 1.5px;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Dark translucent capsule container -->
  <rect x="10" y="10" width="940" height="280" rx="40" ry="40" class="translucent-capsule-dark" />

  <!-- THE BOUNDARY SYSTEM ICON -->
  <g transform="translate(100, 75)">
    <!-- Red Out-Of-Scope Boundary -->
    <path d="M 60,10 L 15,10 L 15,140 L 60,140" class="blocked-perimeter" />
    <circle cx="15" cy="75" r="9" fill="#ef4444" />
    <circle cx="60" cy="10" r="6" fill="#ef4444" />
    <circle cx="60" cy="140" r="6" fill="#ef4444" />
    
    <!-- Green In-Scope Boundary -->
    <path d="M 90,10 L 135,10 L 135,140 L 90,140" class="allowed-perimeter" />
    <circle cx="135" cy="75" r="9" fill="#10b981" />
    <circle cx="90" cy="10" r="6" fill="#10b981" />
    <circle cx="90" cy="140" r="6" fill="#10b981" />

    <!-- Protected Central Hub Asset -->
    <circle cx="75" cy="75" r="15" fill="#6272f0" />
    <circle cx="75" cy="75" r="6" fill="#ffffff" />
    
    <!-- Crossing verification link lines -->
    <line x1="45" y1="75" x2="60" y2="75" stroke="#ef4444" stroke-width="3" />
    <line x1="90" y1="75" x2="105" y2="75" stroke="#10b981" stroke-width="3" />
  </g>

  <!-- Vertical Anchor Divider -->
  <line x1="300" y1="65" x2="300" y2="235" class="divider-line-dark" />

  <!-- Typography: Vallum -->
  <text x="350" y="150" class="text-title-dark">Vallum</text>
</svg>
