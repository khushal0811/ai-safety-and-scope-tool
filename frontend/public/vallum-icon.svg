<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%" fill="none">
  <!-- LEFT SIDE: Red Blocked / Out-Of-Scope Boundary -->
  <path d="M 60,15 L 20,15 L 20,135 L 60,135" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="20" cy="75" r="9" fill="#ef4444" />
  <circle cx="60" cy="15" r="7" fill="#ef4444" />
  <circle cx="60" cy="135" r="7" fill="#ef4444" />
  
  <!-- RIGHT SIDE: Green Allowed / In-Scope Boundary -->
  <path d="M 90,15 L 130,15 L 130,135 L 90,135" stroke="#10b981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="130" cy="75" r="9" fill="#10b981" />
  <circle cx="90" cy="15" r="7" fill="#10b981" />
  <circle cx="90" cy="135" r="7" fill="#10b981" />

  <!-- Verification Link Pins -->
  <line x1="44" y1="75" x2="60" y2="75" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  <line x1="90" y1="75" x2="106" y2="75" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Central Defended Target Core -->
  <circle cx="75" cy="75" r="16" fill="#6272f0" />
  <circle cx="75" cy="75" r="6" fill="#ffffff" />
</svg>
