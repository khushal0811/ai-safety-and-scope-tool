<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Google Fonts Integration -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
    </style>
    
    <!-- SVG Translucent Hardware Frost Filter -->
    <filter id="translucent-frost" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Translucent Capsule Layer: High-density alpha white with active backdrop blur */
      .translucent-capsule { 
        fill: rgba(255, 255, 255, 0.85); 
        stroke: rgba(255, 255, 255, 0.95); 
        stroke-width: 2.5; 
        filter: url(#translucent-frost); 
      }
      
      .divider-line { stroke: #204144; stroke-width: 4; stroke-linecap: round; }
      
      /* Red Blocked Perimeter styling */
      .blocked-perimeter { stroke: #ef4444; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      
      /* Green Allowed Secure Line styling */
      .allowed-perimeter { stroke: #10b981; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      
      /* Typography optimized with precise alignment metrics */
      .text-title { 
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; 
        font-weight: 800; 
        font-size: 92px; 
        fill: #204144; 
        letter-spacing: 2px;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- ==================== TRANSLUCENT FROSTED GLASS CAPSULE ==================== -->
  <rect x="10" y="10" width="880" height="280" rx="40" ry="40" class="translucent-capsule" />

  <!-- ==================== THE BOUNDARY SYSTEM ICON ==================== -->
  <g transform="translate(130, 75)">
    <!-- LEFT SIDE OF ICON: Red Out-Of-Scope Boundary -->
    <path d="M 60,10 L 15,10 L 15,140 L 60,140" class="blocked-perimeter" />
    <circle cx="15" cy="75" r="9" fill="#ef4444" />
    <circle cx="60" cy="10" r="6" fill="#ef4444" />
    <circle cx="60" cy="140" r="6" fill="#ef4444" />
    
    <!-- RIGHT SIDE OF ICON: Green In-Scope Boundary -->
    <path d="M 90,10 L 135,10 L 135,140 L 90,140" class="allowed-perimeter" />
    <circle cx="135" cy="75" r="9" fill="#10b981" />
    <circle cx="90" cy="10" r="6" fill="#10b981" />
    <circle cx="90" cy="140" r="6" fill="#10b981" />

    <!-- Protected Central Hub Asset (In-Scope Target Core) -->
    <circle cx="75" cy="75" r="15" fill="#204144" />
    <circle cx="75" cy="75" r="6" fill="#ffffff" />
    
    <!-- Crossing verification link lines -->
    <line x1="45" y1="75" x2="60" y2="75" stroke="#ef4444" stroke-width="3" />
    <line x1="90" y1="75" x2="105" y2="75" stroke="#10b981" stroke-width="3" />
  </g>

  <!-- ==================== VERTICAL ANCHOR DIVIDER ==================== -->
  <line x1="335" y1="65" x2="335" y2="235" class="divider-line" />

  <!-- ==================== BRAND TYPOGRAPHY SYSTEM ==================== -->
  <text x="375" y="150" class="text-title">Vallum</text>
</svg>
