services:
  - type: web
    name: vallum-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render's edge proxy connects over the private 10.0.0.0/8 network. Trust forwarded
    # headers only from that network; never use "*" or trust arbitrary client headers.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="$FORWARDED_ALLOW_IPS"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "https://vallum.vercel.app"
      - key: FORWARDED_ALLOW_IPS
        value: "10.0.0.0/8"
      - key: KEY_VAULT_MASTER_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_KEY
        sync: false
